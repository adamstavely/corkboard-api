# Local dev: Postgres, and Elasticsearch for search. Host ports are offset (5440, 9210) to stay clear of other apps.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: corkboard
      POSTGRES_PASSWORD: corkboard
      POSTGRES_DB: corkboard
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corkboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Search only (Postgres is the source of truth); security off here only.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9210:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  esdata:
